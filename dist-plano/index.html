á puesto.`,`Tocá Tirar. Sale un plantel de River de un año concreto y se revela el mazo con una animación.`,`Elegí un jugador del mazo y después tocá el punto verde compatible de la cancha. La elección guarda al instante.`,`Repetí hasta completar el XI y el banco, poné capitán y dorsales, y cerrá el draft.`]},{tipo:`nota`,texto:`Un sorteo da un solo jugador. Si el año no sirve, podés Pasar (3 pases en copa, 5 en ligas) o usar el resorteo gratis cuando el plantel no aporta a las posiciones que faltan.`}]},{titulo:`3. Armar el XI y el banco`,bloques:[{tipo:`p`,texto:`La cancha muestra los puntos del once titular y la pestaña Banco los suplentes. Un punto verde significa que el jugador elegido puede ocuparlo: vale su posición natural o una secundaria. El juego rechaza cualquier puesto inexistente o incompatible.`},{tipo:`ul`,items:[`Mundial: plantel de 16 (XI + 5 suplentes).`,`Premier y Argentina: plantel de 19 (XI + 8 suplentes).`,`Sin repetidos: no podés elegir dos veces al mismo jugador del mismo año.`,`La misma persona en otro año sí se puede sumar al plantel.`,`Cada sorteo usa un plantel distinto dentro de la misma partida.`,`El buscador y el filtro por posición del mazo sirven para ubicar rápido a un jugador.`,`Cambios XI ↔ banco: se hacen entre partidos, nunca en vivo.`]},{tipo:`p`,texto:`Al cerrar el draft son obligatorios el capitán (brazalete ©) y los dorsales del XI (1-99, sin repetir). El banco debe cubrir las tres líneas de campo: defensa, medio y ataque. El arquero va solo al once y aparece bloqueado al armar el banco. Además, cada suplente debe poder jugar en algún puesto del once y no puede haber más de dos del mismo puesto natural.`},{tipo:`nota`,texto:`Las elecciones son definitivas: no hay botón de quitar ni confirmación intermedia. Elegir jugador y puesto queda guardado al instante; podés cerrar la pestaña y retomar después.`}]},{titulo:`4. Formatos`,bloques:[{tipo:`h3`,texto:`Mundial`},{tipo:`p`,texto:`River Plate más 31 rivales sorteados entre los 79 planteles campeones. Sorteo balanceado por bombos con cabezas de serie: 8 grupos de 4, clasifican los dos primeros de cada grupo, octavos cruzados y cuadro fijo hasta la final en Madrid. Son 7 partidos.`},{tipo:`h3`,texto:`Premier`},{tipo:`p`,texto:`River Plate más 19 rivales. Fixture de ida y vuelta: 38 fechas. Se juega fecha a fecha y se puede simular hasta la fecha que quieras.`},{tipo:`h3`,texto:`Argentina`},{tipo:`p`,texto:`River Plate más 29 rivales, repartidos en dos zonas de 15 por sistema snake según OVR. Fecha 1 a 15 de zona, fecha 16 interzonal con el clásico contra Boca garantizado, y playoffs del 17 al 20: octavos cruzados (1°A-8°B, etc.), cuartos, semifinales y final. Clasifican los ocho primeros de cada zona.`},{tipo:`nota`,texto:`Cada partida sortea rivales distintos: nunca te va a tocar exactamente la misma copa o liga dos veces. Boca siempre aparece como rival del clásico.`}]},{titulo:`5. Jugar una fecha`,bloques:[{tipo:`ol`,items:[`En la previa se ven los escudos de época, el OVR de ambos equipos, el historial y las casas de apuestas: pasá el mouse o tocá “¿Qué dicen las casas de apuestas?” para ver los porcentajes de la misma simulación que después juega el partido.`,`Tocá Jugar. El relato se escribe minuto a minuto, con goleadores, asistencias, figura y calificaciones.`,`La crónica “Minuto a minuto” muestra cada gol con el escudo del equipo, el jugador y el marcador parcial.`,`El marcador tipo tablero se actualiza con los goles; si salís campeón cae confeti y el equipo queda marcado con estrellas.`,`El resto de los partidos de la fecha se simula automáticamente y la tabla se actualiza sola.`,`Después podés seguir a la fecha siguiente, simular hasta una fecha (en ligas) o volver al presente con el reproductor de temporada.`]},{tipo:`p`,texto:`El resultado, el detalle y la tabla quedan guardados: podés cerrar la pestaña y retomar después.`},{tipo:`nota`,texto:`Se puede ver el último estado guardado sin conexión, pero no se puede jugar offline: la simulación y el guardado necesitan conexión con el servicio del juego.`}]},{titulo:`6. Tabla y desempates`,bloques:[{tipo:`p`,texto:`La tabla muestra siempre todas las filas, a ancho completo: #, Equipo, PJ, G, E, P, GF, GC, Dif, Pts y Últimos 5. Cada equipo tiene cinco puntitos con el resultado de sus últimos partidos y una flecha de tendencia. En pantallas chicas se puede desplazar horizontalmente, nunca hacia abajo.`},{tipo:`ol`,items:[`Puntos ganados (3 por victoria, 1 por empate).`,`Diferencia de gol.`,`Goles a favor.`,`Fair play (menos sanciones).`,`Sorteo.`]},{tipo:`p`,texto:`El reproductor de temporada tiene un slider y el botón ▶ Reproducir temporada: recorre la tabla fecha por fecha y resalta con un flash las filas que cambiaron. Volver al presente te devuelve a la tabla actual.`},{tipo:`nota`,texto:`En el cierre se muestran goleadores, asistidores, once ideal y MVP de cada temporada, además del palmarés por formato.`}]},{titulo:`7. Tarjetas, cambios y capitán`,bloques:[{tipo:`p`,texto:`Las amarillas se acumulan: cada dos amarillas el jugador se pierde el partido siguiente; la roja lo saca de inmediato. Las sanciones se cumplen con el banco. Si no hay suplente para cubrir el puesto, se avisa y se juega con diez.`},{tipo:`p`,texto:`Los cambios se hacen solo entre partidos: arrastrando en la cancha o desde la sección del torneo. No se permite cambiar un once en el medio de un partido.`},{tipo:`ul`,items:[`El capitán lleva el brazalete © y desempata la elección de figura.`,`Sinergia: 3 jugadores del mismo club y año suman +1 al OVR efectivo; 5 o más suman +2 (tope).`,`OVR del equipo: promedio simple de los once titulares.`,`El OVR final de cada jugador se calcula: River suma +1 si ese año fue campeón, +3 si fue MVP o +2 si fue estrella; los rivales (todos campeones) suman +2 por MVP o +1 por estrella.`]}]},{titulo:`8. Estadísticas y modos`,bloques:[{tipo:`p`,texto:`El panel de estadísticas reúne a los goleadores del torneo, la bestia negra (el rival contra el que mejor rendimiento tenés), los rivales más y menos cruzados, el historial por equipo con su sparkline de puntos y el duelo de temporadas.`},{tipo:`p`,texto:`“Tu plantel mezcla N épocas” indica cuántos años distintos aportaron jugadores a tu plantel, ordenados por año real de cada plantel.`},{tipo:`ul`,items:[`Normal: una partida, una competencia.`,`Carrera: tres o más torneos seguidos, conservando cinco jugadores entre uno y otro.`,`Revancha amistosa: se repite el fixture, pero no suma logros ni ranking.`]},{tipo:`p`,texto:`Logros: debut, campeón, 7A0 (campeón con valla invicta), humilde, de memoria, goleada, vallas y revancha. En el Mundial, el gran objetivo es 7A0.`}]},{titulo:`9. Logros y medallas`,bloques:[{tipo:`p`,texto:`Los logros se desbloquean solos cuando se cumple su condición jugando: debutar, salir campeón, ganar el clásico, terminar un torneo invicto, convertir goleadas, mantener vallas, jugar de memoria y otras metas. No hay que activarlos ni pedirlos.`},{tipo:`ul`,items:[`Cada logro suma una medalla. La dificultad de la competencia define su color: 7 partidos da bronce, Mundial da plata, Premier da oro y Argentina da diamante.`,`Jugar de memoria sube un escalón, hasta diamante. Carrera solo se muestra en la etiqueta: no cambia la medalla.`,`Los logros más difíciles (5 goles de un jugador, 5 pases gol, torneo perfecto, valla total y clásico doble) aseguran una medalla de diamante aunque se consigan en un formato más fácil.`,`La revancha amistosa no suma logros ni medallas.`,`En “Tus drafts · Logros” podés ver cuándo se consiguió cada uno, cómo se desbloquea, la dificultad y el detalle de medallas. En el inicio solo se muestra el resumen.`]},{tipo:`p`,texto:`Tus logros y medallas se guardan en este dispositivo junto con el progreso de la partida, para que sigan ahí cuando volvés. No hace falta iniciar sesión.`},{tipo:`nota`,texto:`Si jugás en otro dispositivo, los logros locales se cuentan desde cero; los títulos de cada partida se consultan con su identificador.`}]},{titulo:`10. Atajos y preguntas frecuentes`,bloques:[{tipo:`ul`,items:[`T: mostrar u ocultar la ayuda rápida “Cómo jugar” dentro del draft.`,`Esc: cerrar paneles y volver a la vista anterior.`,`La guía rápida se recuerda: una vez cerrada, no vuelve a aparecer.`]},{tipo:`h3`,texto:`¿Puedo borrar un jugador que elegí?`},{tipo:`p`,texto:`No. Las elecciones son definitivas, como en 7a0. Solo se pueden intercambiar titulares y suplentes entre partidos.`},{tipo:`h3`,texto:`¿Por qué un punto de la cancha no está verde?`},{tipo:`p`,texto:`Porque el jugador elegido no juega en ese puesto natural ni secundario, o porque ese slot ya está ocupado.`},{tipo:`h3`,texto:`¿Qué pasa si se corta la conexión?`},{tipo:`p`,texto:`El equipo y el torneo siguen guardados. Al volver a abrir la página se recupera todo.`},{tipo:`h3`,texto:`¿Se puede jugar sin conexión?`},{tipo:`p`,texto:`No. El estado se puede consultar sin conexión, pero jugar y guardar requieren conexión con el servicio del juego.`}]}],Jb=[{titulo:`Del dado al draft`,bloques:[{tipo:`p`,texto:`3A1 nació a partir de 7A0. En su primera versión, se tiraba un dado que determinaba un plantel real y permitía elegir un jugador que hubiera formado parte de él.`},{tipo:`p`,texto:`En 3A1, el dado fue reemplazado por un mazo de temporadas: aparece un año de River Plate, elegís un jugador de ese plantel y lo ubicás en la cancha.`},{tipo:`p`,texto:`La diferencia principal es que el equipo se construye jugador por jugador y después debe afrontar una competición completa, fecha por fecha, contra rivales que existieron en la historia del fútbol.`}]},{titulo:`River a través de las décadas`,bloques:[{tipo:`p`,texto:`El juego reúne planteles de River Plate de muchas temporadas. Esto permite recorrer distintas generaciones del club y combinar futbolistas que pertenecieron a épocas diferentes.`},{tipo:`p`,texto:`Cada temporada representa una oportunidad para descubrir jugadores, recuperar nombres históricos y construir equipos con futbolistas que nunca compartieron una cancha en la realidad.`}]},{titulo:`Los rivales tienen historia`,bloques:[{tipo:`p`,texto:`Los equipos rivales no son planteles inventados: los incluidos en el juego corresponden a equipos que consiguieron títulos en sus respectivas competiciones.`},{tipo:`p`,texto:`Cada temporada del archivo aporta una parte de la historia futbolística que sirve como escenario para las competiciones de 3A1.`}]},{titulo:`El OVR se calcula, no se copia`,bloques:[{tipo:`p`,texto:`Las valoraciones de los jugadores se construyen a partir de sus logros históricos.`},{tipo:`p`,texto:`Los futbolistas de River reciben bonificaciones según tres criterios:`},{tipo:`ul`,items:[`+1 por haber sido campeón.`,`+3 por haber sido MVP.`,`+2 por haber sido estrella.`]},{tipo:`p`,texto:`Los jugadores de los equipos rivales, cuyos planteles corresponden a campeones, reciben +1 por campeonato, +2 por MVP y +1 por estrella.`},{tipo:`p`,texto:`De esta manera, la valoración final no depende únicamente de un número asignado, sino también de los reconocimientos obtenidos durante cada temporada.`}]},{titulo:`Siempre aparece Boca`,bloques:[{tipo:`p`,texto:`No importa qué combinación de equipos salga en el sorteo: Boca siempre está presente como rival del clásico.`},{tipo:`p`,texto:`En Argentina, el enfrentamiento se disputa en la fecha interzonal. En las demás competiciones, Boca forma parte del fixture.`},{tipo:`p`,texto:`El clásico también tiene un relato y un logro propios, aunque no otorga bonificaciones adicionales de puntos.`}]},{titulo:`El desafío 7A0`,bloques:[{tipo:`p`,texto:`El objetivo máximo del Mundial es conseguir el 7A0: salir campeón sin recibir ningún gol durante toda la competición.`},{tipo:`p`,texto:`No alcanza con ganar los partidos. Hay que mantener la valla invicta desde el comienzo hasta la final.`},{tipo:`p`,texto:`Es uno de los desafíos más exigentes que propone 3A1.`}]},{titulo:`Cada partida es diferente`,bloques:[{tipo:`p`,texto:`Los equipos rivales se distribuyen en cuatro bombos según su OVR para equilibrar los grupos y las zonas.`},{tipo:`p`,texto:`A partir de esos bombos se generan distintas combinaciones de rivales y fixtures. Por eso, dos partidas pueden tener recorridos completamente diferentes, incluso cuando se utiliza el mismo formato de competición.`}]},{titulo:`Fútbol de otras épocas`,bloques:[{tipo:`p`,texto:`Una de las particularidades de 3A1 es que permite reunir jugadores de distintas generaciones en un mismo equipo.`},{tipo:`p`,texto:`Podés combinar futbolistas de temporadas separadas por décadas, elegir distintas formaciones y construir un plantel que nunca existió en la realidad.`},{tipo:`p`,texto:`La historia proporciona los jugadores; el draft te permite escribir una nueva versión de esa historia.`}]}],Yb=[{titulo:`Qué es 3A1`,resumen:`El juego, la idea y los formatos.`,grupo:`general`,bloques:[{tipo:`p`,texto:`3A1 es un juego de draft de fútbol histórico en el que construís tu propio equipo con jugadores reales de River Plate y competís contra planteles campeones de distintos equipos y épocas.`},{tipo:`p`,texto:`Cada partida comienza con un draft: seleccionás jugadores a partir de temporadas históricas de River, definís tu formación y preparás un equipo para afrontar una competición completa. Podés jugar en tres formatos: Mundial, Premier y Argentina.`}]},{titulo:`¿Necesito registrarme?`,resumen:`Cómo empezar a jugar.`,grupo:`general`,bloques:[{tipo:`p`,texto:`No. 3A1 funciona directamente en el navegador: no hay cuenta ni registro. Podés armar una partida corta desde el celular o la computadora, elegir tu formación, probar el modo de almanaque y empezar de nuevo cuando quieras.`},{tipo:`p`,texto:`Tus elecciones, logros y preferencias se guardan en este dispositivo, así que podés volver después sin ingresar datos personales.`}]},{titulo:`¿Necesito saber mucho de fútbol?`,resumen:`Aprender jugando.`,grupo:`general`,bloques:[{tipo:`p`,texto:`No. Si conocés mucho, 3A1 te permite encontrar detalles de época y futbolistas menos obvios. Si estás empezando, la cancha muestra la posición y la valoración de cada jugador para que aprendas mientras armás un equipo competitivo.`},{tipo:`p`,texto:`El modo de almanaque es una opción para probar tus conocimientos cuando quieras un desafío extra.`}]},{titulo:`Modos de juego`,resumen:`Cinco experiencias dentro de 3A1.`,grupo:`general`,bloques:[{tipo:`p`,texto:`El juego cuenta con diferentes experiencias:`},{tipo:`ul`,items:[`**Mundial:** competí contra clubes campeones de distintas partes del mundo hasta llegar a la final.`,`**Premier:** enfrentá una liga de clubes campeones y buscá terminar en lo más alto de la tabla.`,`**Argentina:** disputá una competición con zonas, fecha interzonal, clásico y playoffs.`,`**De Memoria:** poné a prueba cuánto sabés sobre los jugadores y planteles históricos.`,`**Carrera:** progresá a través de una experiencia de juego basada en tus resultados.`]}]},{titulo:`Estado del proyecto`,resumen:`Qué está disponible hoy.`,grupo:`general`,bloques:[{tipo:`p`,texto:`Las tres competiciones principales están implementadas y cuentan con sus respectivos sistemas de disputa y resolución de partidos.`},{tipo:`p`,texto:`También están disponibles los logros, el ranking, el historial de partidas, el palmarés y las estadísticas por temporada.`},{tipo:`p`,texto:`Las fotografías de los jugadores rivales continúan en proceso de incorporación. Mientras tanto, se utilizan imágenes alternativas disponibles. Esto no afecta el funcionamiento ni los resultados de las simulaciones.`}]},{titulo:`Datos y fuentes`,resumen:`Planteles, participaciones y valoraciones.`,grupo:`general`,bloques:[{tipo:`p`,texto:`La base histórica de 3A1 reúne información de planteles reales de River Plate y de equipos campeones de distintas épocas.`},{tipo:`p`,texto:`La información de River se recopiló y organizó a partir de documentos históricos. Para los equipos rivales se consultaron páginas y sitios especializados de cada club, buscando información sobre sus formaciones, planteles, escudos y temporadas.`},{tipo:`p`,texto:`Las fotografías de los jugadores se recopilaron a partir de diarios, publicaciones y búsquedas en Google, priorizando imágenes que permitieran identificar a los futbolistas y sus respectivas épocas.`},{tipo:`p`,texto:`Las valoraciones finales de los equipos y jugadores se calculan mediante el sistema propio del juego.`}]},{titulo:`Fuentes de inspiración`,resumen:`Referencias para la investigación y el diseño.`,grupo:`general`,bloques:[{tipo:`p`,texto:`Una de las principales referencias para la investigación histórica y el diseño visual de 3A1 fue [La Historia de River](https://lahistoriariver.com/).`},{tipo:`p`,texto:`Su contenido y presentación sirvieron como referencia para organizar la información histórica y construir la identidad visual de la página.`}]},{titulo:`Accesibilidad y rendimiento`,resumen:`Cómodo en computadora y celular.`,grupo:`general`,bloques:[{tipo:`p`,texto:`3A1 busca ofrecer una experiencia cómoda tanto en computadoras como en dispositivos móviles.`},{tipo:`ul`,items:[`Interfaz adaptable a diferentes tamaños de pantalla.`,`Tablas y elementos de navegación optimizados para dispositivos móviles.`,`Elementos interactivos accesibles mediante teclado y con indicadores de foco visibles.`,`Animaciones adaptadas a la preferencia del sistema de reducir movimiento.`,`Recursos visuales optimizados para mejorar los tiempos de carga.`]}]},{titulo:`Créditos`,resumen:`Autoría, agradecimientos y recursos.`,grupo:`general`,bloques:[{tipo:`p`,texto:`3A1 es un juego de draft histórico de River Plate, armado con planteles y rivales reales de distintas épocas.`},{tipo:`ul`,items:[`**Autoría:** proyecto 3A1.`,`**Agradecimientos:** a quienes aportaron escudos, fotografías y datos históricos usados en el juego.`,`**Recursos:** documentos históricos de planteles, escudos de época y retratos del archivo del proyecto.`,`**Posibles errores:** por la cantidad de jugadores y fotos de muchas épocas, pueden existir errores o datos incompletos. Si encontrás uno, avisá por el canal de contacto.`]},{tipo:`nota`,texto:`Los nombres y datos de jugadores pertenecen a sus respectivos clubes y fuentes históricas.`}]},{titulo:`Contacto`,resumen:`Soporte, errores y sugerencias.`,grupo:`general`,bloques:[{tipo:`p`,texto:`Si tenés una consulta sobre cómo jugar, encontraste un error en un plantel o una foto, o querés proponer una mejora, escribinos directamente por correo.`},{tipo:`h3`,texto:`En qué podemos ayudarte`},{tipo:`ul`,items:[`Consultas generales y problemas para jugar o continuar una partida.`,`Correcciones de planteles, nombres, fotos o escudos.`,`Novedades sobre enlaces compartidos y resultados guardados.`,`Preguntas sobre privacidad, permisos de imágenes y uso de marcas.`,`Comentarios sobre la experiencia de juego.`]},{tipo:`p`,texto:`Para dudas de privacidad o sobre los datos técnicos del sitio, también podés escribir al mismo correo.`},{tipo:`contacto`,correo:`kouvah26@gmail.com`,texto:`Escribinos a`}]},{titulo:`Privacidad y datos`,resumen:`Qué se guarda y para qué.`,grupo:`privacidad`,bloques:[{tipo:`p`,texto:`3A1 almacena la información necesaria para ofrecer sus funcionalidades, como el progreso de las partidas, las estadísticas, los logros y el historial de juego.`},{tipo:`p`,texto:`Los datos se utilizan exclusivamente para el funcionamiento de las características del juego y no deben compartirse con terceros sin una finalidad informada.`}]},{titulo:`Cookies y almacenamiento`,resumen:`Preferencias y continuidad entre sesiones.`,grupo:`privacidad`,bloques:[{tipo:`p`,texto:`3A1 puede utilizar mecanismos de almacenamiento local para conservar preferencias y datos de navegación entre sesiones.`},{tipo:`p`,texto:`La información almacenada permite mejorar la continuidad de la experiencia y evitar que el usuario tenga que configurar nuevamente determinados elementos.`},{tipo:`nota`,texto:`Este almacenamiento vive en tu dispositivo. Podés borrarlo cuando quieras desde la configuración del navegador.`}]},{titulo:`Seguridad`,resumen:`Protección de tus datos y de las partidas.`,grupo:`privacidad`,bloques:[{tipo:`p`,texto:`La seguridad de los datos y de las partidas es una parte importante del funcionamiento de 3A1.`},{tipo:`p`,texto:`Se aplican medidas para proteger la información almacenada, controlar el acceso a las funcionalidades y evitar modificaciones no autorizadas.`},{tipo:`h3`,texto:`Seguridad del usuario`},{tipo:`p`,texto:`No hay acceso con cuenta ni formularios de datos personales: tu progreso, tus preferencias y tus logros quedan guardados en este dispositivo.`},{tipo:`h3`,texto:`Seguridad de la página`},{tipo:`p`,texto:`Las partidas, los resultados y los catálogos del juego se controlan para que una acción desde la página no modifique información ajena a esa partida.`}]}],Xb=[{titulo:`1. Aviso legal`,bloques:[{tipo:`p`,texto:`3A1 es un juego de draft de fútbol histórico creado por aficionados. No es un producto oficial de River Plate, de otros clubes, de federaciones, torneos, futbolistas, marcas ni titulares de derechos mencionados en el sitio.`},{tipo:`p`,texto:`Los nombres de equipos, jugadores, competiciones y temporadas aparecen para describir planteles reales y permitir reconocerlos dentro del juego. Escudos, nombres y retratos pertenecen a sus respectivos dueños.`},{tipo:`p`,texto:`Nada de lo que se muestra acá debe interpretarse como patrocinio, aval, licencia, vínculo comercial o relación editorial con esos titulares. Si detectás un uso problemático de una marca, una imagen o un dato, escribinos al correo de contacto para revisarlo.`},{tipo:`nota`,texto:`Última actualización: 24 de noviembre de 2026.`}]},{titulo:`2. Términos de uso`,bloques:[{tipo:`p`,texto:`3A1 funciona en el navegador y es gratuito. Al entrar y jugar, aceptás usarlo con buen criterio y entender que cada simulación es entretenimiento, no un resultado deportivo real.`},{tipo:`h3`,texto:`Uso del juego`},{tipo:`p`,texto:`Podés jugar sin registrarte. Tu plantel, tus elecciones y tus marcadores forman parte de una dinámica lúdica: no son competencias oficiales ni pronósticos profesionales.`},{tipo:`ul`,items:[`No automatices partidas ni hagas consultas masivas.`,`No intentes interferir en el funcionamiento del sitio ni modificar resultados ajenos.`,`No copies el juego a escala ni lo raspees de forma abusiva.`,`No uses enlaces compartidos para engañar a otras personas.`,`No compartas el identificador de tu partida: funciona como clave para recuperarla y no hay contraseñas.`]},{tipo:`h3`,texto:`Resultados compartidos`},{tipo:`p`,texto:`Los marcadores y enlaces sirven para mostrar una simulación hecha a modo de juego. No deben usarse para afirmar una afiliación oficial, prometer algo comercial o presentar una simulación como un resultado real.`},{tipo:`h3`,texto:`Disponibilidad`},{tipo:`p`,texto:`Hacemos lo posible para mantener 3A1 accesible, pero el proyecto puede cambiar, pausar funciones o ajustar planteles con el tiempo. Si algo deja de estar disponible, buscamos que la experiencia principal siga siendo clara y jugable.`},{tipo:`nota`,texto:`Última actualización: 24 de noviembre de 2026.`}]},{titulo:`3. Política de privacidad`,bloques:[{tipo:`p`,texto:`3A1 no pide cuenta, nombre, correo ni datos de pago para arrancar una partida. La parte esencial del juego se ejecuta en el navegador y guarda lo necesario para continuar donde lo dejaste y consultar tus estadísticas.`},{tipo:`h3`,texto:`Datos que se guardan`},{tipo:`p`,texto:`En tu dispositivo se conservan preferencias como formato, estilo, guía, sonido, carrera y palmarés local. En el servicio del juego quedan la partida, los jugadores elegidos, el calendario, los resultados, las sanciones y los cierres de torneo.`},{tipo:`p`,texto:`Los registros técnicos del servidor pueden incluir dirección IP, tipo de dispositivo, navegador, URL solicitada, fecha y hora, además de señales necesarias para mantener el servicio disponible.`},{tipo:`h3`,texto:`Cookies, análisis y publicidad`},{tipo:`p`,texto:`Hoy 3A1 no usa herramientas de analítica ni de publicidad, y no instala cookies de seguimiento. Si más adelante se activaran servicios de ese tipo, se limitarían a medir visitas agregadas, detectar abuso y mejorar la estabilidad, conforme a las políticas de cada proveedor.`},{tipo:`h3`,texto:`Verificación contra abuso`},{tipo:`p`,texto:`Algunas funciones pueden pasar verificaciones técnicas del proveedor de hosting para distinguir visitas reales de tráfico automatizado. Esas comprobaciones pueden procesar señales del navegador y de la red según la política de ese proveedor.`},{tipo:`h3`,texto:`Consentimiento y controles`},{tipo:`p`,texto:`Podés bloquear o borrar los datos guardados en el navegador desde su configuración. Algunas funciones, como las preferencias o la protección contra abuso, pueden quedar limitadas si desactivás esas tecnologías.`},{tipo:`h3`,texto:`Contacto`},{tipo:`p`,texto:`Si tenés dudas sobre privacidad, cookies o el tratamiento de datos técnicos, escribinos a [kouvah26@gmail.com](mailto:kouvah26@gmail.com).`},{tipo:`nota`,texto:`Última actualización: 24 de noviembre de 2026.`}]},{titulo:`4. Derechos del usuario`,bloques:[{tipo:`p`,texto:`Podés borrar directamente los datos locales del sitio desde tu navegador. Para pedir acceso, rectificación o eliminación de los datos del juego, indicá el identificador de la partida al responsable del proyecto por el canal de contacto.`},{tipo:`p`,texto:`No hay datos de menores recogidos deliberadamente; si detectás ese caso, comunicálo por ese mismo canal.`},{tipo:`p`,texto:`Según el lugar desde el que accedas, pueden aplicarte leyes locales de protección de datos. Este documento no sustituye el asesoramiento legal correspondiente.`}]},{titulo:`5. Propiedad intelectual`,bloques:[{tipo:`p`,texto:`Los nombres, escudos y retratos históricos pertenecen a sus respectivos titulares y se usan con fines informativos y de demostración del juego. El
