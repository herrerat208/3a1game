<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="3A1 · draft de fútbol: armá tu 11 histórico de River y jugá el torneo" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#ece8dc" />
    <script>
      // Tema elegido antes de pintar, para evitar el parpadeo claro→oscuro.
      (function () {
        var guardado = null
        try { guardado = localStorage.getItem('3a1:tema') } catch (e) { /* sin almacenamiento */ }
        var oscuro = guardado ? guardado === 'oscuro'
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro'
        document.querySelector('meta[name="theme-color"]').content = oscuro ? '#11100F' : '#ece8dc'
      })()
    </script>
    <title>3A1 — Draft histórico de River</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
